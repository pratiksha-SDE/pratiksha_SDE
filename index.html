<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Profile</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: Arial, sans-serif;
			line-height: 1.6;
			color: #243447;
			background: #eef4f8;
		}

		header {
			padding: 32px 20px;
			text-align: center;
			color: white;
			background: #176b87;
		}

		nav a {
			margin: 0 8px;
			color: white;
			text-decoration: none;
		}

		nav a:hover {
			text-decoration: underline;
		}

		main {
			width: min(900px, 92%);
			margin: 24px auto;
		}

		section {
			margin-bottom: 20px;
			padding: 24px;
			background: white;
			border-radius: 8px;
			box-shadow: 0 2px 8px rgba(36, 52, 71, 0.1);
		}

		h1,
		h2 {
			margin-top: 0;
		}

		.skills {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			padding: 0;
			list-style: none;
		}

		.skills li {
			padding: 6px 12px;
			color: white;
			background: #e76f51;
			border-radius: 4px;
		}

		footer {
			padding: 20px;
			text-align: center;
			color: white;
			background: #243447;
		}
	</style>
</head>
<body>
	<header>
		<h1>Hello, I am Alex</h1>
		<p>Beginner web developer</p>
		<nav aria-label="Main navigation">
			<a href="#about">About</a>
			<a href="#skills">Skills</a>
			<a href="#contact">Contact</a>
		</nav>
	</header>

	<main>
		<section id="about">
			<h2>About Me</h2>
			<p>
				I am learning how to build websites with HTML and CSS.
				This is my first simple webpage.
			</p>
		</section>

		<section id="skills">
			<h2>My Skills</h2>
			<ul class="skills">
				<li>HTML</li>
				<li>CSS</li>
				<li>Learning JavaScript</li>
			</ul>
		</section>

		<section id="contact">
			<h2>Contact Me</h2>
			<p>Email: <a href="mailto:alex@example.com">alex@example.com</a></p>
		</section>
	</main>

	<footer>
		<p>&copy; 2026 Alex. Made with HTML and CSS.</p>
	</footer>
</body>
</html>
